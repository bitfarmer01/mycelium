<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mycelium</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --panel2:#171b21; --line:#232830;
    --text:#e6e9ee; --muted:#8b95a5; --dim:#5f6875;
    --green:#3ecf8e; --red:#ff6161; --grey:#7a8494; --accent:#6aa9ff; --amber:#ffc857;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --font:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Cantarell,"Noto Sans",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:15px; line-height:1.45; -webkit-text-size-adjust:100%;
    overflow-wrap:anywhere;
  }
  [hidden]{display:none !important}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .hint{color:var(--dim); font-size:11.5px; font-weight:400; letter-spacing:.02em}

  /* ---------- header ---------- */
  header.top{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 14px; background:rgba(11,13,16,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-weight:650; letter-spacing:.02em; font-size:15px}
  .brand .dot{color:var(--green)}
  .spacer{flex:1 1 auto}
  .wsdot{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block;flex:none}
  .wsdot.on{background:var(--green); box-shadow:0 0 6px rgba(62,207,142,.7)}

  /* ---------- layout ---------- */
  main.layout{
    display:grid; gap:12px; padding:12px; max-width:1280px; margin:0 auto;
    grid-template-columns:minmax(0,1fr) minmax(240px,320px);
    grid-template-areas:
      "feed vitals"
      "ask  ask";
    align-items:start;
  }
  @media (max-width:760px){
    main.layout{grid-template-columns:minmax(0,1fr); grid-template-areas:"feed" "vitals" "ask"; padding:10px; gap:10px}
  }
  .feed{grid-area:feed} .vitals{grid-area:vitals} .ask{grid-area:ask}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px;
    min-width:0;
  }
  .panel > h2{
    margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--muted); font-weight:600; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  }

  /* ---------- buttons / inputs ---------- */
  .btn{
    font:inherit; color:var(--text); background:var(--panel2);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px; cursor:pointer;
    transition:border-color .15s, background .15s, transform .05s;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{border-color:#39414d; background:#1c2129}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .btn.small{padding:5px 9px; font-size:12.5px; border-radius:8px}
  .btn.primary{background:#1b2a3f; border-color:#2c4a70}
  .btn.talk{touch-action:none; user-select:none; -webkit-user-select:none}
  .btn.talk.rec{background:#3a1c1c; border-color:#6a2b2b; color:#ffd7d7}

  input[type=text]{
    font:inherit; color:var(--text); background:#0e1116; border:1px solid var(--line);
    border-radius:9px; padding:10px 11px; width:100%; min-width:0;
  }
  input[type=text]:focus-visible{outline:2px solid var(--accent); outline-offset:1px}

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px;
    background:#0e1116; border:1px solid var(--line); color:var(--muted);
    border-radius:999px; padding:2px 8px; white-space:nowrap;
  }
  .badge b{color:var(--text); font-weight:600}
  .badge.green{color:#c7f5e1; border-color:#1f4a37; background:#0f1c17}
  .badge.red{color:#ffd5d5; border-color:#542424; background:#1d1010}
  .badge.amber{color:#ffe9bd; border-color:#54431c; background:#1c1710}
  .badge.grey{color:#cfd5de}

  /* ---------- feed ---------- */
  .feedlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
  .feedrow{
    border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:#0e1116;
    font-size:13px; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 6px; min-width:0;
  }
  .feedrow .sep{color:var(--dim)}
  .feedrow .ftype{font-weight:650; letter-spacing:.01em}
  .feedrow .ftarget{color:var(--muted); font-family:var(--mono); font-size:12px}
  .feedrow .fdelta{font-family:var(--mono); font-size:12px; white-space:nowrap}
  .feedrow .fdelta .arrow{color:var(--dim); margin:0 2px}
  .feedrow .fdelta .d{color:var(--muted)}
  .feedrow .fcause{color:var(--muted); flex-basis:100%; font-size:12px}
  .feedrow.ev-green{border-left:3px solid var(--green)} .feedrow.ev-green .ftype{color:var(--green)}
  .feedrow.ev-red{border-left:3px solid var(--red)}   .feedrow.ev-red .ftype{color:var(--red)}
  .feedrow.ev-grey{border-left:3px solid var(--grey)} .feedrow.ev-grey .ftype{color:#aab3c0}
  @keyframes flashrow{from{background:rgba(106,169,255,.22)} to{background:#0e1116}}
  .feedrow.flash{animation:flashrow 1.1s ease-out 1}
  .empty{color:var(--dim); font-size:13px; margin:4px 2px}
  @media (prefers-reduced-motion:reduce){.feedrow.flash{animation:none}}

  /* ---------- vitals ---------- */
  .vgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
  .vcell{background:#0e1116; border:1px solid var(--line); border-radius:9px; padding:7px 9px; min-width:0}
  .vcell .k{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim)}
  .vcell .v{font-family:var(--mono); font-size:16px; margin-top:1px}
  .vrow{display:flex; align-items:baseline; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .vlabel{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim)}
  .vnum{font-family:var(--mono); font-size:14px}
  .vquote{color:var(--muted); font-size:13px; font-style:italic}

  /* ---------- ask ---------- */
  .askinput{display:flex; gap:8px; align-items:stretch; flex-wrap:wrap}
  .askinput input{flex:1 1 180px}
  .askinput .btn{flex:0 0 auto}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .status{min-height:18px; margin-top:8px; font-size:12.5px; color:var(--muted)}
  .status.err{color:var(--red)} .status.ok{color:var(--green)} .status.busy{color:var(--amber)}

  .answer{margin-top:12px; border-top:1px solid var(--line); padding-top:12px}
  .metabar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  .spoken{font-size:16px; margin:0 0 10px; padding-left:10px; border-left:2px solid var(--accent)}
  .screen{white-space:pre-wrap; font-size:14.5px; margin:0 0 10px}
  sup.cite{
    color:var(--accent); cursor:pointer; font-family:var(--mono); font-size:11px;
    padding:0 1px; border-radius:4px; user-select:none;
  }
  sup.cite:hover{background:#16233a}
  sup.cite:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .chunk{
    border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:9px;
    background:#0e1116; padding:9px 10px; margin:0 0 10px; font-size:13px;
  }
  .chunk .ctitle{font-weight:600; margin-bottom:3px}
  .chunk a{color:var(--accent); text-decoration:none; word-break:break-all}
  .chunk a:hover{text-decoration:underline}
  .chunk .csnip{color:var(--muted); margin:5px 0}
  .chunk .cmeta{font-family:var(--mono); font-size:11.5px; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  .chunk .close{background:none;border:none;color:var(--dim);cursor:pointer;font:inherit;padding:0;margin-left:auto}

  .chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .chip{
    font:inherit; text-align:left; cursor:pointer; color:var(--text);
    background:#0e1116; border:1px solid var(--line); border-radius:10px; padding:7px 9px;
    display:flex; flex-direction:column; gap:2px; flex:1 1 160px; min-width:0;
    transition:border-color .15s, background .15s;
  }
  .chip:hover{border-color:#39414d}
  .chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .chip .chead{font-size:12px; color:var(--muted)}
  .chip .chead b{color:var(--text); font-weight:650}
  .chip .cbody{font-size:13px}
  .chip .cnum{font-family:var(--mono); font-size:11px; color:var(--dim)}
  .chip.taken{border-color:var(--green); background:#0f1c17}
  .chip.taken .cnum{color:#8fe0bd}
  .chip:disabled{cursor:default; opacity:1}

  .flip{font-size:13px; color:var(--muted); margin:6px 0 4px}
  .flip .fliplabel{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
    margin-right:6px;
  }
  .whyp{font-size:13px; color:var(--muted); margin:6px 0}
  .whyp b{color:var(--dim); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.08em; margin-right:6px}

  .priorwrap{margin-top:12px}
  .priorhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px}
  .priorhead span:first-child{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim)}
  .prior{display:flex; flex-direction:column; gap:6px}
  .pbar{display:grid; grid-template-columns:58px 1fr 52px; align-items:center; gap:8px}
  .plabel{font-size:12px; color:var(--muted)}
  .ptrack{height:10px; border-radius:999px; background:#0e1116; border:1px solid var(--line); overflow:hidden}
  .pfill{
    height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#2b6cff,#6aa9ff);
    transition:width .6s cubic-bezier(.2,.7,.3,1);
  }
  .pnum{font-family:var(--mono); font-size:12px; color:var(--muted); text-align:right}
  @media (prefers-reduced-motion:reduce){.pfill{transition:none}}

  /* ---------- reflect / improve ---------- */
  .subbox{margin-top:14px; border-top:1px solid var(--line); padding-top:12px}
  .subhead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  .subhead h3{margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
  .sentence{background:#0e1116; border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:8px; font-size:13.5px}
  .sentence .srow{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:6px}
  .ridchip{
    font-family:var(--mono); font-size:11px; color:var(--muted); background:#161a20;
    border:1px solid var(--line); border-radius:6px; padding:1px 6px;
  }
  .cand{border:1px solid var(--line); border-left:4px solid var(--grey); border-radius:10px; padding:9px 10px; margin-bottom:8px; background:#0e1116}
  .cand .chead{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:4px}
  .cand .tag{font-size:11px; font-weight:700; letter-spacing:.08em; padding:1px 7px; border-radius:999px; border:1px solid var(--line)}
  .cand .cname{font-weight:600; font-size:13.5px}
  .cand .caxis{font-size:11.5px; color:var(--dim)}
  .cand .cline{font-family:var(--mono); font-size:12.5px; color:var(--text); margin:3px 0}
  .cand .creason{font-size:13px; color:#ffd5d5}
  .cand .cfoot{font-family:var(--mono); font-size:11px; color:var(--dim); display:flex; gap:10px; flex-wrap:wrap; margin-top:4px}
  .cand.block{border-left-color:var(--red); background:#150f0f}
  .cand.block .tag{color:#ffd5d5; border-color:#542424; background:#1d1010}
  .cand.pass{border-left-color:var(--green); background:#0f1c17}
  .cand.pass .tag{color:#c7f5e1; border-color:#1f4a37; background:#10201a}
  .cand.veto{border-left-color:var(--grey)}
  .cand.veto .tag{color:#cfd5de}
  .cand.pending{border-left-color:var(--amber)}
  .cand.pending .tag{color:#ffe9bd; border-color:#54431c; background:#1c1710}
  .playing{color:var(--green)}
  @media (max-width:520px){
    .pbar{grid-template-columns:50px 1fr 46px}
    .vcell .v{font-size:15px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">Mycelium<span class="dot">.</span></div>
  <div class="spacer"></div>
  <span class="badge mono" id="sessionBadge" title="session id">session —</span>
  <button class="btn small" id="newSessionBtn" type="button">New session</button>
  <span class="badge mono" id="wsBadge" title="event stream"><span class="wsdot" id="wsDot"></span> live</span>
</header>

<main class="layout">

  <!-- ============ FEED ============ -->
  <section class="panel feed" aria-label="Feed">
    <h2>Feed <span class="hint" id="feedCount">0 / 20</span></h2>
    <p class="empty" id="feedEmpty">Waiting for ledger events…</p>
    <ul class="feedlist" id="feed" aria-live="polite"></ul>
  </section>

  <!-- ============ VITALS ============ -->
  <section class="panel vitals" aria-label="Vitals">
    <h2>Vitals</h2>
    <div id="vitalsBody"><p class="empty">loading…</p></div>
  </section>

  <!-- ============ ASK ============ -->
  <section class="panel ask" aria-label="Ask">
    <h2>Ask</h2>

    <div class="askinput">
      <input type="text" id="q" placeholder="Ask a question…" autocomplete="off" aria-label="Question">
      <button class="btn primary" id="sendBtn" type="button">Send</button>
      <button class="btn talk" id="talkBtn" type="button" title="Hold to talk">Hold to talk</button>
    </div>

    <div class="actions">
      <button class="btn small" id="reflectBtn" type="button">What did you learn today?</button>
      <button class="btn small" id="improveBtn" type="button">Improve yourself</button>
      <button class="btn small" id="tickBtn" type="button">Tick</button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <!-- answer -->
    <div class="answer" id="answer" hidden>
      <div class="metabar">
        <span class="badge mono" id="shapeBadge"></span>
        <span class="badge mono" id="citeBadge"></span>
        <span class="badge mono" id="entropyBadge"></span>
        <span class="badge mono" id="slotBadge"></span>
        <span class="badge mono" id="msBadge"></span>
        <button class="btn small" id="replayBtn" type="button">Replay</button>
      </div>

      <p class="spoken" id="spoken"></p>
      <div class="screen" id="screen"></div>
      <div class="chunk" id="chunkCard" hidden></div>
      <div class="chips" id="chips" role="group" aria-label="Readings"></div>
      <p class="whyp" id="why"></p>
      <p class="flip"><span class="fliplabel">flip condition</span><span id="flip"></span></p>

      <div class="buttons" style="margin:10px 0 2px">
        <button class="btn small" id="confirmBtn" type="button">Confirm</button>
      </div>

      <div class="priorwrap">
        <div class="priorhead"><span>prior</span><span class="hint">literal · intent · scope</span></div>
        <div class="prior" id="prior"></div>
      </div>
    </div>

    <!-- reflect -->
    <div class="subbox" id="reflectBox" hidden>
      <div class="subhead">
        <h3>Learned today</h3>
        <span class="badge" id="reflectMeta"></span>
      </div>
      <div id="sentences"></div>
    </div>

    <!-- improve -->
    <div class="subbox" id="improveBox" hidden>
      <div class="subhead">
        <h3>Candidates</h3>
        <span class="badge mono" id="improveMeta"></span>
      </div>
      <div id="candidates"></div>
    </div>
  </section>

</main>

<script>
(function () {
  "use strict";

  /* ---------------- helpers ---------------- */
  var $ = function (s, r) { return (r || document).querySelector(s); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = String(text);
    return n;
  }
  function slash(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v, dp) {
    if (v == null || v === "") return "—";
    var n = Number(v);
    if (!isFinite(n)) return String(v);
    if (dp == null) {
      return (Math.abs(n) >= 100 ? n.toFixed(0) : n.toFixed(3)).replace(/0+$/, "").replace(/\.$/, "");
    }
    return n.toFixed(dp);
  }
  function signed(v, dp) {
    if (v == null || v === "") return "—";
    var n = Number(v);
    if (!isFinite(n)) return String(v);
    return (n >= 0 ? "+" : "") + num(n, dp);
  }
  function meanOf(m) {
    if (Array.isArray(m)) {
      var xs = m.map(Number).filter(isFinite);
      if (!xs.length) return null;
      return xs.reduce(function (a, b) { return a + b; }, 0) / xs.length;
    }
    var n = Number(m);
    return isFinite(n) ? n : null;
  }
  function clamp01(v) { v = Number(v); return isFinite(v) ? Math.max(0, Math.min(1, v)) : 0; }

  async function jget(path) {
    var res = await fetch(path, { headers: { Accept: "application/json" } });
    var data = null;
    try { data = await res.json(); } catch (e) { /* not json */ }
    if (!res.ok) {
      throw new Error((data && (data.detail || data.error)) || (res.status + " " + res.statusText));
    }
    return data || {};
  }
  async function jpost(path, body) {
    var res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body == null ? {} : body)
    });
    var data = null;
    try { data = await res.json(); } catch (e) { /* not json */ }
    if (!res.ok) {
      throw new Error((data && (data.detail || data.error)) || (res.status + " " + res.statusText));
    }
    return data || {};
  }

  /* ---------------- state ---------------- */
  var ROLE_ORDER = ["literal", "intent", "scope"];
  var FEED_MAX = 20;
  var state = {
    sessionId: null,
    ask: null,          // last /ask response
    prior: null,        // last known prior vector
    lastSpoken: "",
    candidates: {},     // sandbox_id|name -> candidate row
    improveShown: false,
    wsTries: 0
  };
  var priorEls = {}, currentAudio = null, ws = null, wsTimer = null, vitalsTimer = null, pendingVitals = null;

  /* ---------------- status ---------------- */
  var statusEl = $("#status");
  function setStatus(msg, kind) {
    statusEl.className = "status" + (kind ? " " + kind : "");
    statusEl.textContent = msg || "";
  }

  /* ---------------- session ---------------- */
  function newSessionId() {
    try {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    } catch (e) { /* ignore */ }
    return "sess-" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }
  function renderSession() {
    var b = $("#sessionBadge");
    b.textContent = "session " + String(state.sessionId).slice(0, 8);
    b.title = "session id: " + state.sessionId;
  }

  /* ---------------- audio ---------------- */
  function browserSpeak(text) {
    try {
      if (!window.speechSynthesis || !text) return;
      speechSynthesis.cancel();
      speechSynthesis.speak(new SpeechSynthesisUtterance(String(text)));
    } catch (e) { /* ignore */ }
  }
  function stopAudio() {
    if (currentAudio) {
      try { currentAudio.pause(); } catch (e) { /* ignore */ }
      currentAudio = null;
    }
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  }
  // play audio_url; on any failure fall back to speechSynthesis on the same text
  function speak(text, audioUrl) {
    stopAudio();
    var src = audioUrl || (text ? "/tts?text=" + encodeURIComponent(text) : null);
    if (!src) return;
    var a;
    try { a = new Audio(src); } catch (e) { browserSpeak(text); return; }
    currentAudio = a;
    a.onerror = function () { browserSpeak(text); };
    var p = a.play();
    if (p && typeof p.catch === "function") p.catch(function () { browserSpeak(text); });
  }

  /* ---------------- feed ---------------- */
  var feedEl = $("#feed");
  function updateFeedEmpty() {
    $("#feedEmpty").hidden = feedEl.children.length > 0;
    $("#feedCount").textContent = feedEl.children.length + " / " + FEED_MAX;
  }
  function eventClass(type) {
    var t = String(type || "").toLowerCase();
    if (/confirm|promote/.test(t)) return "ev-green";
    if (/correct|veto/.test(t)) return "ev-red";
    return "ev-grey";
  }
  function feedRow(row) {
    var li = el("li", "feedrow " + eventClass(row.type));
    var type = row.type == null ? "event" : String(row.type);
    var target = [row.target_kind, row.target].filter(function (x) { return x != null && x !== ""; }).join(" ");

    li.appendChild(el("span", "ftype", type));
    li.appendChild(el("span", "sep", "·"));
    li.appendChild(el("span", "ftarget mono", target || "—"));
    li.appendChild(el("span", "sep", "·"));

    var d = el("span", "fdelta");
    d.appendChild(el("span", null, num(row.before) + " → " + num(row.after)));
    if (row.delta != null) d.appendChild(el("span", "d", " (" + signed(row.delta) + ")"));
    li.appendChild(d);

    if (row.cause != null && row.cause !== "") {
      li.appendChild(el("span", "sep", "·"));
      li.appendChild(el("span", "fcause", String(row.cause)));
    }
    if (row.ts != null) li.title = "id " + (row.id == null ? "?" : row.id) + " · " + row.ts;
    return li;
  }
  function feedAdd(row, flash) {
    if (!row || typeof row !== "object") return;
    var li = feedRow(row);
    if (flash !== false) li.classList.add("flash");
    feedEl.insertBefore(li, feedEl.firstChild);           // newest first
    while (feedEl.children.length > FEED_MAX) feedEl.removeChild(feedEl.lastElementChild);
    updateFeedEmpty();
    if (flash !== false) {
      li.addEventListener("animationend", function () { li.classList.remove("flash"); }, { once: true });
    }
  }

  /* ---------------- vitals ---------------- */
  function renderVitals(v) {
    var box = $("#vitalsBody");
    box.textContent = "";

    var slotRow = el("div", "vrow");
    var slotBadge = el("span", "badge mono");
    slotBadge.appendChild(el("b", null, "slot " + (v.slot_version == null ? "—" : v.slot_version)));
    slotRow.appendChild(slotBadge);
    if (v.runner) slotRow.appendChild(el("span", "badge mono grey", "runner " + v.runner));
    box.appendChild(slotRow);

    var baseRow = el("div", "vrow");
    baseRow.appendChild(el("span", "vlabel", "baseline"));
    var b = v.baseline;
    if (!b) {
      baseRow.appendChild(el("span", "vquote", "designed, measured after the demo"));
    } else {
      var m = meanOf(b.means);
      var s = (b.spread == null) ? null : Number(b.spread);
      var txt = (m == null ? "—" : num(m, 2)) + " ± " + (s == null || !isFinite(s) ? "—" : s.toFixed(2));
      if (Array.isArray(b.means)) txt += "  (n=" + b.means.length + ")";
      baseRow.appendChild(el("span", "vnum", txt));
    }
    box.appendChild(baseRow);

    var c = v.counts || {};
    var grid = el("div", "vgrid");
    [["chunk", c.chunk], ["question", c.question], ["lesson", c.lesson], ["candidate", c.candidate]].forEach(function (p) {
      var cell = el("div", "vcell");
      cell.appendChild(el("div", "k", p[0]));
      cell.appendChild(el("div", "v", p[1] == null ? "—" : p[1]));
      grid.appendChild(cell);
    });
    box.appendChild(grid);
  }
  async function loadVitals() {
    try {
      renderVitals(await jget("/vitals"));
    } catch (e) {
      var box = $("#vitalsBody");
      if (!box.children.length) box.appendChild(el("p", "empty", "vitals unavailable"));
    }
  }
  function scheduleVitals() {
    if (pendingVitals) return;
    pendingVitals = setTimeout(function () { pendingVitals = null; loadVitals(); }, 1200);
  }

  /* ---------------- prior bars ---------------- */
  function ensurePrior() {
    var wrap = $("#prior");
    if (wrap.children.length === ROLE_ORDER.length) return;
    wrap.textContent = "";
    priorEls = {};
    ROLE_ORDER.forEach(function (role) {
      var row = el("div", "pbar");
      row.appendChild(el("span", "plabel", role));
      var track = el("div", "ptrack");
      var fill = el("div", "pfill");
      track.appendChild(fill);
      row.appendChild(track);
      var n = el("span", "pnum", "—");
      row.appendChild(n);
      wrap.appendChild(row);
      priorEls[role] = { fill: fill, num: n };
    });
  }
  function applyPrior(values, animate) {
    ensurePrior();
    ROLE_ORDER.forEach(function (role, i) {
      var v = Array.isArray(values) ? clamp01(values[i]) : (i === 0 && typeof values === "number" ? clamp01(values) : 0);
      var refs = priorEls[role];
      if (animate) {
        refs.fill.style.width = (v * 100).toFixed(1) + "%";
      } else {
        refs.fill.style.transition = "none";
        refs.fill.style.width = (v * 100).toFixed(1) + "%";
        void refs.fill.offsetWidth;              // flush layout
        refs.fill.style.transition = "";
      }
      refs.num.textContent = num(v, 3);
    });
  }
  function animatePrior(before, after) {
    applyPrior(before, false);
    requestAnimationFrame(function () { applyPrior(after, true); });
  }

  /* ---------------- answer ---------------- */
  function renderScreen(text, citations) {
    var box = $("#screen");
    box.textContent = "";
    var raw = slash(text == null ? "" : text);
    raw.split(/(\[\d+\])/g).forEach(function (part) {
      if (!part) return;
      var m = /^\[(\d+)\]$/.exec(part);
      if (!m) { box.appendChild(document.createTextNode(part)); return; }
      var n = m[1];
      var sup = el("sup", "cite", "[" + n + "]");
      sup.tabIndex = 0;
      sup.setAttribute("role", "button");
      sup.setAttribute("aria-label", "citation " + n);
      sup.addEventListener("click", function () { showCitation(n); });
      sup.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); showCitation(n); }
      });
      box.appendChild(sup);
    });
  }
  function citationFor(n) {
    var c = (state.ask && state.ask.citations) || [];
    for (var i = 0; i < c.length; i++) if (String(c[i].n) === String(n)) return c[i];
    return null;
  }
  function showCitation(n) {
    var card = $("#chunkCard");
    if (!card.hidden && card.dataset.n === String(n)) { card.hidden = true; return; }
    var c = citationFor(n);
    if (!c) { card.hidden = true; return; }
    card.dataset.n = String(n);
    card.textContent = "";

    var head = el("div", "ctitle");
    head.appendChild(document.createTextNode("[" + n + "] "));
    if (c.link) {
      var a = el("a", null, c.title || c.chunk_id || "source");
      a.href = c.link; a.target = "_blank"; a.rel = "noopener noreferrer";
      head.appendChild(a);
    } else {
      head.appendChild(document.createTextNode(c.title || c.chunk_id || "source"));
    }
    card.appendChild(head);

    if (c.snippet) card.appendChild(el("div", "csnip", String(c.snippet)));

    var meta = el("div", "cmeta");
    if (c.cosine != null) meta.appendChild(el("span", null, "cosine " + num(c.cosine, 3)));
    if (c.chunk_id) meta.appendChild(el("span", null, String(c.chunk_id)));
    var close = el("button", "close", "close");
    close.type = "button";
    close.addEventListener("click", function () { card.hidden = true; });
    meta.appendChild(close);
    card.appendChild(meta);

    card.hidden = false;
  }

  function chipFor(r, taken) {
    var chip = el("button", "chip" + (taken ? " taken" : ""));
    chip.type = "button";
    if (taken) chip.setAttribute("aria-current", "true");

    var head = el("div", "chead");
    head.appendChild(el("b", null, String(r.role == null ? "?" : r.role) + ":"));
    head.appendChild(document.createTextNode(" " + (taken ? "((" : "") ));
    chip.appendChild(head);

    var body = el("div", "cbody", String(r.paraphrase == null ? "" : r.paraphrase) + (taken ? " ))" : ""));
    chip.appendChild(body);

    var nums = el("div", "cnum", "p " + num(r.p, 2) + " · posterior " + num(r.posterior, 2));
    chip.appendChild(nums);

    if (taken) {
      chip.disabled = true;
      chip.title = "taken reading";
      chip.setAttribute("aria-label", "taken reading " + r.role + ": " + r.paraphrase);
    } else {
      chip.title = "tap to correct this reading";
      chip.addEventListener("click", function () { correct(r.role); });
    }
    return chip;
  }
  function renderChips(res) {
    var wrap = $("#chips");
    wrap.textContent = "";
    (res.readings || []).forEach(function (r) { wrap.appendChild(chipFor(r, String(r.role) === String(res.taken))); });
    if (!wrap.children.length) wrap.appendChild(el("span", "hint", "no readings"));
  }

  function renderAnswer(res) {
    state.ask = res;
    state.lastSpoken = res.spoken || "";
    if (res.slot_version != null) $("#slotBadge").textContent = "slot " + res.slot_version;
    $("#shapeBadge").textContent = "shape " + (res.shape == null ? "—" : res.shape);
    $("#citeBadge").textContent = "citations " + (res.citations_resolved == null ? "—" : res.citations_resolved);
    $("#entropyBadge").textContent = "H " + (res.entropy_bits == null ? "—" : num(res.entropy_bits, 3)) + " bits";
    $("#msBadge").textContent = res.ms == null ? "" : res.ms + " ms";
    $("#msBadge").hidden = res.ms == null;

    $("#spoken").textContent = res.spoken == null ? "" : String(res.spoken);
    renderScreen(res.screen, res.citations);
    $("#chunkCard").hidden = true;
    renderChips(res);

    $("#why").textContent = "";
    if (res.why) {
      $("#why").appendChild(el("b", null, "why"));
      $("#why").appendChild(document.createTextNode(String(res.why)));
    }
    $("#flip").textContent = res.flip_condition == null ? "—" : String(res.flip_condition);

    state.prior = res.prior;
    applyPrior(res.prior, false);

    $("#answer").hidden = false;
    speak(res.spoken, res.audio_url);
  }

  /* ---------------- actions ---------------- */
  var sendBtn = $("#sendBtn"), qInput = $("#q");

  async function ask() {
    var text = qInput.value.trim();
    if (!text) { setStatus("type a question, or hold to talk", "err"); qInput.focus(); return; }
    sendBtn.disabled = true;
    setStatus("asking…", "busy");
    try {
      var res = await jpost("/ask", { text: text, session_id: state.sessionId });
      renderAnswer(res);
      setStatus("answered" + (res.ms == null ? "" : " in " + res.ms + " ms"), "ok");
      scheduleVitals();
    } catch (e) {
      setStatus("ask failed: " + e.message, "err");
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function correct(toRole) {
    var q = state.ask;
    if (!q || q.question_id == null) { setStatus("ask something first", "err"); return; }
    setStatus("correcting → " + toRole + "…", "busy");
    try {
      var res = await jpost("/correct", { question_id: q.question_id, to_role: toRole });
      animatePrior(res.prior_before, res.prior_after);
      state.prior = res.prior_after;
      q.taken = toRole;
      (q.readings || []).forEach(function (r) { if (String(r.role) === String(toRole)) r.posterior = 1; });
      renderChips(q);
      var ids = (res.ledger_ids || []).join(", ");
      setStatus("correction recorded" + (ids ? " · ledger " + ids : ""), "ok");
      scheduleVitals();
    } catch (e) {
      setStatus("correct failed: " + e.message, "err");
    }
  }

  async function confirmAnswer() {
    var q = state.ask;
    if (!q || q.question_id == null) { setStatus("ask something first", "err"); return; }
    setStatus("confirming…", "busy");
    try {
      await jpost("/confirm", { question_id: q.question_id });
      setStatus("confirmed", "ok");
      scheduleVitals();
    } catch (e) {
      setStatus("confirm failed: " + e.message, "err");
    }
  }

  async function tick() {
    setStatus("ticking…", "busy");
    try {
      var res = await jpost("/tick", {});
      setStatus("tick · decayed " + (res && res.decayed != null ? res.decayed : "?"), "ok");
      scheduleVitals();
    } catch (e) {
      setStatus("tick failed: " + e.message, "err");
    }
  }

  async function reflect() {
    setStatus("reflecting… (may take ~30 s)", "busy");
    try {
      var res = await jpost("/reflect", {});
      renderReflect(res);
      var n = (res.sentences || []).length;
      setStatus(n + " sentence" + (n === 1 ? "" : "s") + " · rows read " + (res.rows_read == null ? "—" : res.rows_read) + " · dropped " + (res.dropped == null ? "0" : res.dropped), "ok");
      scheduleVitals();
    } catch (e) {
      setStatus("reflect failed: " + e.message, "err");
    }
  }
  function renderReflect(res) {
    var box = $("#sentences");
    box.textContent = "";
    var list = res.sentences || [];
    $("#reflectMeta").textContent = list.length + " sentences · rows " + (res.rows_read == null ? "—" : res.rows_read) + " · dropped " + (res.dropped == null ? "0" : res.dropped);

    list.forEach(function (s) {
      var node = el("div", "sentence");
      node.appendChild(document.createTextNode(String(s.text == null ? "" : s.text)));
      var row = el("div", "srow");
      (s.row_ids || []).forEach(function (id) { row.appendChild(el("span", "ridchip", String(id))); });
      var play = el("button", "btn small", "play");
      play.type = "button";
      play.addEventListener("click", function () { speak(s.text, null); });
      row.appendChild(play);
      node.appendChild(row);
      box.appendChild(node);
    });
    if (!list.length) box.appendChild(el("p", "empty", "nothing yet today"));

    $("#reflectBox").hidden = false;
    if (res.audio_url) speak(list.map(function (s) { return s.text; }).join(" "), res.audio_url);
  }

  async function improve() {
    setStatus("improving… (sandboxes may take a while)", "busy");
    try {
      var res = await jpost("/improve", {});
      $("#improveBox").hidden = false;
      renderImprove(res);
      if (res.slot_version != null) $("#slotBadge").textContent = "slot " + res.slot_version;
      var scored = (res.candidates || []).filter(function (c) { return c.verdict; }).length;
      var blocked = (res.candidates || []).filter(function (c) { return /vetoed_prelint/.test(String(c.status)); }).length;
      setStatus("candidates: " + (res.candidates || []).length + " · blocked " + blocked + " · scored " + scored, "ok");
      scheduleVitals();
    } catch (e) {
      setStatus("improve failed: " + e.message, "err");
    }
  }
  function candidateKey(c) { return String(c.sandbox_id || c.name || ""); }
  function candidateCard(c, baseline) {
    var status = String(c.status || "");
    var vetoed = /veto/.test(status) && /prelint/.test(status);
    var pass = !vetoed && c.verdict && /pass/i.test(String(c.verdict));
    var voted = !vetoed && c.verdict;
    var cls = vetoed ? "block" : (pass ? "pass" : (voted ? "veto" : "pending"));
    var tag = vetoed ? "BLOCK" : (pass ? "PASS" : (voted ? "VETO" : "…"));

    var card = el("div", "cand " + cls);
    var head = el("div", "chead");
    head.appendChild(el("span", "tag", tag));
    head.appendChild(el("span", "cname", c.name == null ? "(unnamed)" : String(c.name)));
    if (c.axis) head.appendChild(el("span", "caxis", "axis: " + c.axis));
    card.appendChild(head);

    if (vetoed) {
      card.appendChild(el("div", "creason", c.veto_reason ? String(c.veto_reason) : "vetoed before any sandbox run"));
    } else if (!baseline) {
      card.appendChild(el("div", "cline", "awaiting baseline"));
    } else {
      var m = meanOf(baseline.means);
      var s = baseline.spread == null ? null : Number(baseline.spread);
      var line = "baseline " + (m == null ? "—" : num(m, 2)) + " ± " + (s == null || !isFinite(s) ? "—" : s.toFixed(2)) +
                 " · candidate " + num(c.mean, 2) +
                 " · delta " + signed(c.delta, 2);
      card.appendChild(el("div", "cline", line));
    }

    var foot = el("div", "cfoot");
    ["status", "verdict", "spread", "ratio", "sandbox_id", "runner"].forEach(function (k) {
      if (c[k] == null || c[k] === "") return;
      foot.appendChild(el("span", null, k + " " + c[k]));
    });
    if (foot.children.length) card.appendChild(foot);
    return card;
  }
  function renderImprove(res) {
    var wrap = $("#candidates");
    wrap.textContent = "";
    state.candidates = {};
    var list = res.candidates || [];
    $("#improveMeta").textContent = (list.length || 0) + " candidates" + (res.baseline == null ? " · baseline pending" : "");
    list.forEach(function (c) {
      state.candidates[candidateKey(c)] = c;
      wrap.appendChild(candidateCard(c, res.baseline));
    });
    state.improveShown = true;
    if (!list.length) wrap.appendChild(el("p", "empty", "no candidates"));
  }
  function upsertCandidate(row, action) {
    if (!row || typeof row !== "object") return;
    var key = candidateKey(row);
    if (action === "delete") delete state.candidates[key];
    else state.candidates[key] = row;
    if (!$("#improveBox").hidden) {
      var wrap = $("#candidates");
      if (wrap.firstChild && wrap.firstChild.classList && wrap.firstChild.classList.contains("empty")) wrap.textContent = "";
      wrap.appendChild(candidateCard(row, null));
    }
  }

  /* ---------------- speech to text (hold to talk) ---------------- */
  var talkBtn = $("#talkBtn");
  var rec = null, recChunks = [], recStream = null, recStart = 0, recActive = false;

  function pickMime() {
    var opts = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus"];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
    for (var i = 0; i < opts.length; i++) if (MediaRecorder.isTypeSupported(opts[i])) return opts[i];
    return "";
  }
  function talkDown(ev) {
    if (ev && ev.preventDefault) ev.preventDefault();
    if (recActive) return;
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setStatus("recording not supported in this browser — type instead", "err");
      return;
    }
    recActive = true;
    talkBtn.classList.add("rec");
    talkBtn.textContent = "recording…";
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recStream = stream;
      recChunks = [];
      var mime = pickMime();
      try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
      catch (e) { rec = new MediaRecorder(stream); }
      rec.ondataavailable = function (e) { if (e.data && e.data.size) recChunks.push(e.data); };
      rec.onstop = function () {
        var type = rec.mimeType || "audio/webm";
        if (recStream) recStream.getTracks().forEach(function (t) { t.stop(); });
        recStream = null;
        var blob = new Blob(recChunks, { type: type });
        recChunks = [];
        if (blob.size < 1200 || Date.now() - recStart < 400) { setStatus("hold the button while you speak", "err"); return; }
        stt(blob);
      };
      recStart = Date.now();
      rec.start();
      setStatus("recording — release to transcribe", "busy");
    }).catch(function () {
      talkUp();
      setStatus("microphone permission denied", "err");
    });
  }
  function talkUp() {
    talkBtn.classList.remove("rec");
    talkBtn.textContent = "Hold to talk";
    if (rec && rec.state === "recording") { try { rec.stop(); } catch (e) { /* ignore */ } }
    recActive = false;
  }
  async function stt(blob) {
    setStatus("transcribing…", "busy");
    try {
      var fd = new FormData();
      fd.append("audio", blob, "audio.webm");
      var res = await fetch("/stt", { method: "POST", body: fd });
      var data = null;
      try { data = await res.json(); } catch (e) { /* ignore */ }
      if (!res.ok) throw new Error((data && (data.detail || data.error)) || (res.status + " " + res.statusText));
      qInput.value = (data && data.text) ? String(data.text) : "";
      setStatus(qInput.value ? "transcript ready — press Send" : "no speech detected", qInput.value ? "ok" : "err");
      qInput.focus();
    } catch (e) {
      setStatus("transcription failed: " + e.message, "err");
    }
  }

  /* ---------------- websocket ---------------- */
  function wsBadge(on) {
    $("#wsDot").classList.toggle("on", !!on);
    $("#wsBadge").title = on ? "event stream connected" : "event stream disconnected (retrying)";
  }
  function handleEvent(msg) {
    if (!msg || typeof msg !== "object") return;
    var row = msg.row || {};
    if (msg.table === "ledger") { feedAdd(row, true); scheduleVitals(); }
    else if (msg.table === "candidate") { upsertCandidate(row, msg.action); scheduleVitals(); }
  }
  function connectWS() {
    var proto = location.protocol === "https:" ? "wss:" : "ws:";
    try { ws = new WebSocket(proto + "//" + location.host + "/events"); }
    catch (e) { scheduleReconnect(); return; }
    ws.onopen = function () { state.wsTries = 0; wsBadge(true); };
    ws.onmessage = function (ev) {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      handleEvent(msg);
    };
    ws.onclose = function () { wsBadge(false); scheduleReconnect(); };
    ws.onerror = function () { try { ws.close(); } catch (e) { /* ignore */ } };
  }
  function scheduleReconnect() {
    var n = Math.min(state.wsTries++, 6);
    var delay = Math.min(30000, 500 * Math.pow(2, n)) + Math.floor(Math.random() * 300);
    clearTimeout(wsTimer);
    wsTimer = setTimeout(connectWS, delay);
  }

  /* ---------------- wiring ---------------- */
  function newSession() {
    state.sessionId = newSessionId();
    renderSession();
    state.ask = null;
    state.prior = null;
    $("#answer").hidden = true;
    $("#chunkCard").hidden = true;
    $("#reflectBox").hidden = true;
    setStatus("new session — corrections will not carry to the next person", "ok");
    stopAudio();
  }

  sendBtn.addEventListener("click", ask);
  qInput.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); ask(); } });
  $("#confirmBtn").addEventListener("click", confirmAnswer);
  $("#replayBtn").addEventListener("click", function () { speak(state.lastSpoken, state.ask && state.ask.audio_url); });
  $("#reflectBtn").addEventListener("click", reflect);
  $("#improveBtn").addEventListener("click", improve);
  $("#tickBtn").addEventListener("click", tick);
  $("#newSessionBtn").addEventListener("click", newSession);

  talkBtn.addEventListener("pointerdown", talkDown);
  talkBtn.addEventListener("pointerup", talkUp);
  talkBtn.addEventListener("pointercancel", talkUp);
  talkBtn.addEventListener("pointerleave", function () { if (recActive) talkUp(); });
  talkBtn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  talkBtn.addEventListener("keydown", function (ev) {
    if ((ev.key === " " || ev.key === "Enter") && !recActive) { ev.preventDefault(); talkDown(ev); }
  });
  talkBtn.addEventListener("keyup", function (ev) {
    if (ev.key === " " || ev.key === "Enter") { ev.preventDefault(); talkUp(); }
  });

  /* ---------------- boot ---------------- */
  newSession();
  updateFeedEmpty();
  connectWS();
  loadVitals();
  vitalsTimer = setInterval(loadVitals, 20000);
  window.addEventListener("beforeunload", function () {
    clearInterval(vitalsTimer); clearTimeout(wsTimer);
    try { if (ws) ws.close(); } catch (e) { /* ignore */ }
  });
})();
</script>
</body>
</html>
