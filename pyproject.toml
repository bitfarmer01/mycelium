[project]
name = "mycelium"
version = "0.1.0"
description = "A context layer over a company's knowledge that learns and proves it"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "surrealdb==2.0.0",
    "numpy",
    "jsonschema",
    "httpx",
    "python-multipart",
    "sentence-transformers",
    "daytona==0.224.1",
    "boto3",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a live SurrealDB (skipped when SURREAL_URL is unset)",
    "slow: loads the embedding model",
]
